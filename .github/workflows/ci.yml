name: CI
on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Lint SQL
        run: sqlfluff lint sql/ --dialect snowflake

      - name: Run Snowpark unit tests
        run: pytest tests/ -v

      - name: Dry-run Snowflake schema changes
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}" | base64 --decode > snowflake_key.p8
          echo "decoded key file: $(wc -c < snowflake_key.p8) bytes, starts with: $(head -c 27 snowflake_key.p8)"
          schemachange deploy \
            --dry-run \
            -a "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            -u "${{ secrets.SNOWFLAKE_USER }}" \
            -r SYSADMIN \
            -w TRANSFORM_WH \
            --snowflake-private-key-path snowflake_key.p8
          rm -f snowflake_key.p8
        env:
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

  terraform-plan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform -chdir=terraform init
      - name: Terraform Plan
        run: |
          export SNOWFLAKE_PRIVATE_KEY="$(echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}" | base64 --decode)"
          terraform -chdir=terraform plan -no-color
        env:
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
